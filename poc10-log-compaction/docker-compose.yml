version: "3.8"

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-poc10
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Compaction normally only runs when a segment rolls and ages past
      # these thresholds. Set tiny so the demo doesn't require waiting
      # minutes for the log cleaner to notice there's work to do.
      KAFKA_LOG_SEGMENT_BYTES: 1024
      KAFKA_LOG_SEGMENT_MS: 5000
      KAFKA_LOG_CLEANER_BACKOFF_MS: 1000
      KAFKA_LOG_CLEANER_MIN_CLEANABLE_RATIO: "0.01"
